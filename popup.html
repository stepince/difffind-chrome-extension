<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DiffFind Launcher</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <img src="assets/wordmark.png" width="216" alt="DiffFind" />
    </header>
    <p class="tagline">Find what changed.<br />Understand what matters.</p>
    <button type="button" id="openDiffFind">
      Open DiffFind <span aria-hidden="true">↗</span>
    </button>
    <p class="destination">
      <span aria-hidden="true">●</span> app.difffind.com
    </p>
    <p id="status" role="status" aria-live="polite"></p>
    <footer>
      Opens in a dedicated window.<br />Your next launch returns you to it.
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
